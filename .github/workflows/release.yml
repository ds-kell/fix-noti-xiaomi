name: Release
# Push a tag like v0.8.0 to build a signed APK and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Never publish an APK signed with another key: users could not update.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are missing (see scripts/export-signing-secrets.sh)"; exit 1; fi
          mkdir -p signing && echo "$KEYSTORE_BASE64" | base64 -d > signing/hypernotifyfix-release.jks
          printf 'storeFile=signing/hypernotifyfix-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "HyperNotifyFix-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: HyperNotifyFix-*.apk
          generate_release_notes: true

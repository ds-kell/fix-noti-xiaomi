name: Android CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      # The default package list includes the long-removed `tools` package, which sdkmanager 16+ rejects.
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Same fixed key as local builds (from secrets), so CI APKs install over them. Without secrets: runner debug key.
      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secrets, using the debug key"; exit 0; fi
          mkdir -p signing && echo "$KEYSTORE_BASE64" | base64 -d > signing/hypernotifyfix-release.jks
          printf 'storeFile=signing/hypernotifyfix-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with: {name: HyperNotifyFix-debug, path: app/build/outputs/apk/debug/app-debug.apk}
